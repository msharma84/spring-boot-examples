server:
  port: 8081

spring:
  application:
    name: spring-redis

  management:
    endpoint:
      health:
        show-details: always
        redis:
          enabled: true
    endpoints:
      web:
        exposure:
          include: "*"
    metrics:
      enable:
        jdbc: true
        redis: true
  data:
    redis:
      timeout: 500ms
      connect-timeout: 1000ms

  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool Sizing
      maximum-pool-size: 15
      minimum-idle: 10
      # Lifecycle & Timeouts (in milliseconds)
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Health & Testing
      validation-timeout: 5000
      leak-detection-threshold: 2000
      pool-name: SPRING_REDIS
      is-auto-commit: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  redis:
    host: localhost
    port: 6379
    cache:
      type: redis


